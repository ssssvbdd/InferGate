server:
  addr: "127.0.0.1:8080"
  read_timeout: 30s
  write_timeout: 0s
  shutdown_timeout: 15s
  upstream_timeout: 120s

admin:
  addr: "127.0.0.1:8090"
  enabled: false

redis:
  enabled: false
  addr: ""

log:
  level: info
  encoding: json

tracing:
  enabled: false
  service_name: infergate
  sample_ratio: 0.1

metrics:
  enabled: true
  addr: "127.0.0.1:6060"
  path: /metrics

registry:
  type: static
  cache_ttl: 30s
  refresh_ttl: 10s

limiter:
  expr_cache_size: 5242880
  default_rate: 0
  default_burst: 0
  default_period: 1s
  rules: []

auth:
  keys_file: config/keys.json
  cache_salt_secret_file: config/cache-salt.key
  max_in_flight: 8

usage:
  ledger_file: run/usage.jsonl

readiness:
  url: http://127.0.0.1:8000/health
  timeout: 2s
