# Run two independently healthy vLLM instances before selecting this file.
models:
  - name: qwen3-4b
    version: default
    model_type: llm
    provider_type: generic
    provider_model: qwen3-4b
    credential:
      api_key_env: VLLM_API_KEY
    discovery: static
    load_balance: round_robin
    endpoints:
      - id: vllm-a
        host: 127.0.0.1
        port: 18001
        scheme: http
        weight: 1
        max_in_flight: 4
        metadata: {allow_internal: "true"}
      - id: vllm-b
        host: 127.0.0.1
        port: 18002
        scheme: http
        weight: 1
        max_in_flight: 4
        metadata: {allow_internal: "true"}
    timeout: 120s
    stream_idle_timeout: 90s
    max_retries: 1  # Only connection-establishment failures are retried.
    max_in_flight: 8
    max_waiting: 8
    wait_timeout: 2s
    max_context_tokens: 8192
    max_output_tokens: 1024
