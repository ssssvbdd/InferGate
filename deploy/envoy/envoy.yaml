# Example TLS ingress for two InferGate processes on the same host.
# Provision the certificate files before starting Envoy. The gateway ports
# remain bound to loopback and are never exposed directly.
static_resources:
  listeners:
    - name: infergate_https
      address:
        socket_address: {address: 0.0.0.0, port_value: 8443}
      per_connection_buffer_limit_bytes: 1048576
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /etc/infergate/tls.crt}
                    private_key: {filename: /etc/infergate/tls.key}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: infergate_ingress
                codec_type: AUTO
                max_request_headers_kb: 32
                stream_idle_timeout: 300s
                common_http_protocol_options:
                  idle_timeout: 300s
                route_config:
                  name: infergate_routes
                  virtual_hosts:
                    - name: infergate
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: infergate_replicas
                            timeout: 0s  # SSE has no total duration cap.
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: infergate_replicas
      type: STATIC
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: infergate_replicas
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 18082}
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 18083}
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check: {path: /readyz}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 256
            max_pending_requests: 32
            max_requests: 256
admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 19901}
